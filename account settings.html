<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/CSS/account settings.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <section class="container">
        <h1 class="accountsettings">
            Account Settings
        </h1>
    <hr>
        <section class="card_container">
            <div class="unidiv">
                <i> <i class="ri-lock-fill"></i></i>
                <div>
                    <h5><b>Privacy</b></h5>
                    <p>Manage your Privacy settings.</p>
                </div>
            </div>
            <div class="unidiv">
                <i> <i class="ri-notification-2-fill"></i></i>
                <div>
                    <h5><b>Notifications</b></h5>
                    <p>Configure alerts</p>
                </div>
            </div>
            <div class="unidiv">
                <i> <i class="ri-bank-card-fill"></i></i>
                <div>
                    <h5><b>Biling</b></h5>
                    <p>Payment methods and plans.</p>
                </div>
            </div>
            <div class="unidiv">
                <i> <i class="ri-global-line"></i></i>
                <div>
                    <h5><b>Language</b></h5>
                    <p>English(US)</p>
                </div>
            </div>
            <div class="unidiv">
                <i> <i class="ri-palette-fill"></i></i>
                <div>
                    <h5><b>Theme</b></h5>
                    <p>Light mode</p>
                </div>
            </div>
            <div class="unidiv">
                <i> <i class="ri-shield-user-fill"></i></i>
                <div>
                    <h5><b>Security</b></h5>
                    <p>2FA, Passwords. etc</p>
                </div>
            </div>
        </section>
    </section>
</body>

</html>
